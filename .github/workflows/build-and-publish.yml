name: Build and Publish Android App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission
        run: chmod +x gradlew

      - name: Clean Project
        run: ./gradlew clean

      - name: Build Release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Show Build Outputs
        run: |
          echo "================ APK FILES ================"
          find . -name "*.apk" || true

          echo ""
          echo "================ AAB FILES ================"
          find . -name "*.aab" || true

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "No APK was generated."
            exit 1
          fi

          echo "Found APK: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Locate AAB
        id: aab
        run: |
          AAB=$(find . -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "No AAB was generated."
            exit 1
          fi

          echo "Found AAB: $AAB"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-AAB
          path: ${{ steps.aab.outputs.path }}
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Android Release v${{ github.run_number }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.aab.outputs.path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
