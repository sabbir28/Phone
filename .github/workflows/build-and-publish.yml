name: Build and Publish Android App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: gradle

      - name: Grant Execute Permission
        run: chmod +x ./gradlew

      - name: Build Release and Debug APKs
        run: |
          ./gradlew assembleRelease assembleDebug

      - name: Build Release and Debug AABs
        run: |
          ./gradlew bundleRelease bundleDebug

      - name: Upload all APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: |
            app/build/outputs/**/*.apk

      - name: Upload all AAB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-aabs
          path: |
            app/build/outputs/**/*.aab

      - name: Create GitHub Release with all artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: |
            Automated build from commit:
            ${{ github.sha }}
          files: |
            app/build/outputs/**/*.apk
            app/build/outputs/**/*.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
